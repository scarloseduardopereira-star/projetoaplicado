<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Sentinela</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card login-card">
    <div class="brand brand-center">
      <span class="brand-mark" aria-hidden="true">🛡️</span>
      <span class="brand-name">Sentinela</span>
    </div>
    <h1 class="login-title">Acesso restrito</h1>
    <p class="login-sub">Entre com suas credenciais para continuar.</p>

    {% with msgs = get_flashed_messages() %}
      {% if msgs %}<p class="msg err">{{ msgs[0] }}</p>{% endif %}
    {% endwith %}
    {% if error %}<p class="msg err">{{ error }}</p>{% endif %}

    <form method="post" action="{{ url_for('login') }}" autocomplete="on">
      {{ form.hidden_tag() }}
      <label>
        Usuário
        {{ form.username(autocomplete="username", required=true) }}
      </label>
      <label>
        Senha
        {{ form.password(autocomplete="current-password", required=true) }}
      </label>
      <button type="submit">Entrar</button>
    </form>

    <p class="login-foot">
      <span aria-hidden="true">🔒</span>
      Conexão protegida por HTTPS + criptografia pós-quântica
    </p>
  </main>
</body>
</html>
