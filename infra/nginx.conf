# Nginx — proxy reverso TLS para o app Flask (Gunicorn em 127.0.0.1:8000).
# Instalar em: /etc/nginx/sites-available/tccapp  (symlink em sites-enabled).
#
# Estratégia de certificados por SNI:
#   - Conexão ao IP puro (sem SNI)  -> bloco default_server -> cert do IP
#   - Conexão via hostname (SNI)     -> bloco do hostname     -> cert do hostname
# Isto garante "Certificate Trusted: YES" no SSL.org ao testar o IP.

# HTTP -> HTTPS (mantém o desafio ACME para renovação), IP e hostname
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 163.176.123.133 163-176-123-133.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS pelo IP (DEFAULT: conexões ao IP puro, sem SNI, caem aqui)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 163.176.123.133;

    ssl_certificate     /etc/letsencrypt/live/163.176.123.133/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/163.176.123.133/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # PQC: oferece troca de chave híbrida pós-quântica (OpenSSL 3.5)
    ssl_ecdh_curve X25519MLKEM768:X25519:secp256r1:secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS pelo hostname (usado no teste do SSL Labs, via SNI)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 163-176-123-133.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/163-176-123-133.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/163-176-123-133.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519MLKEM768:X25519:secp256r1:secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
