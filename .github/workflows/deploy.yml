name: Deploy para produção (Oracle Cloud)

# Dispara a cada push na branch main — deploy automático no servidor.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-producao
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            sudo git -C /opt/app fetch --all -q
            sudo git -C /opt/app reset --hard origin/main
            sudo /opt/app/.venv/bin/pip install -q -r /opt/app/requirements.txt
            sudo chown -R appuser:appuser /opt/app
            sudo chmod 600 /opt/app/.env
            sudo systemctl restart tccapp
            sleep 2
            systemctl is-active tccapp
            curl -sk -o /dev/null -w 'deploy healthz=%{http_code}\n' https://127.0.0.1/healthz
